<title>RE Game Night Prep</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style id="css">
/* Layout: one column. Floor plan first, then the task list grouped by job. Dark lab look, single theme by choice. */
:root{
  --bg:#0f1312; --panel:#161c1a; --line:#2a3330; --fg:#e7e3d7; --muted:#8e978f;
  --blood:#a51e1e; --herb:#5fa35a; --redherb:#cf3f3f; --fairy:#f2c14e; --glass:#6fa8c7; --screen:#d8dccf;
  --display:"Special Elite","Courier New",monospace; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.planbox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.planbox svg{display:block;width:100%;min-width:560px;height:auto}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px;margin-top:14px;font-size:14px}
.legend div{display:flex;gap:10px;align-items:center;min-width:0}
.sw{flex:none;width:22px;height:10px;border-radius:2px}
.notes{margin:14px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--herb)}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
.group{display:flex;flex-direction:column;gap:2px}
.group h3{padding:14px 0 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:18px;height:18px;margin:3px 0 0;accent-color:var(--herb)}
.task label{min-width:0;cursor:pointer}
.num{font-family:var(--mono);font-weight:500;color:var(--fairy);font-size:13px;margin-right:4px}
.items{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
.task.done .items{text-decoration:line-through}
.task.done label{color:var(--muted);text-decoration:line-through}
.when{font-family:var(--mono);font-size:11px;color:var(--fairy);border:1px solid #4a3f22;border-radius:3px;padding:1px 6px;white-space:nowrap;margin-top:2px}
.owner{grid-column:2/4;display:flex;gap:8px;align-items:center}
.owner span{font-size:12px;color:var(--muted)}
.owner input{flex:1;min-width:0;max-width:240px;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);font:inherit;font-size:14px;padding:2px 0}
.owner input:focus{outline:none;border-bottom-color:var(--fairy)}
input:focus-visible{outline:2px solid var(--fairy);outline-offset:2px}

'<path d="M105,82 C130,150 200,200 265,268" stroke="#e7e3d7" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>'+
'<path d="M375,268 C440,200 510,150 535,90" stroke="#e7e3d7" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>'+
'</svg>';

function legend(){
  var items=[['#a51e1e','Blood cloth divider'],['#f2c14e','Fairy lights along divider tops'],['#d8dccf','Projector screen wall'],['#f2c14e','Projector (box) and beam'],['#3a4441','Seats or beanbags'],['#8e978f','Console table'],['#5fa35a','Green Herb plant'],['#cf3f3f','Red Herb plant'],['#6fa8c7','Window']];
  return items.map(function(i){return '<div><span class="sw" style="background:'+i[0]+'"></span>'+esc(i[1])+'</div>';}).join('');
}

function render(){
  var done=state.tasks.filter(function(t){return t.d;}).length, total=state.tasks.length;
  var groups=[], by={};
  state.tasks.forEach(function(t){ if(!by[t.g]){by[t.g]=[];groups.push(t.g);} by[t.g].push(t); });
  var h='<div class="wrap"><header><h1>RE Game Night Prep</h1><p class="sub">Three projector stations, one social bay by the window, and a hub in the middle. Every task is numbered and lists what it needs. Add an owner to each task and tick it when done; changes save for everyone with edit access. Committee briefs are in the RE Game Night Committee Brief doc.</p></header>';
  h+='<section><h2>Floor plan</h2><p class="sub">Two cloth dividers run along each diagonal of the room and meet at an open hub. Guests enter by the left door, queue at the hub, and leave by the right door. Drinks stay in the window bay, away from every console.</p><div class="planbox">'+PLAN+'</div><div class="legend">'+legend()+'</div>'+
  '<ul class="notes"><li>All ceiling lights get red paper. Fairy lights give the bays their glow.</li><li>If the projectors are fixed to the ceiling, put the seats under the beam, never in front of the lens.</li><li>Keep the cloth at least 1 m from projectors; they get hot.</li><li>The photobooth faces the divider, so window light falls on guests, not behind them.</li><li>Use RE9 Requiem as a guest slot on any station if someone brings the hardware.</li></ul></section>';
  h+='<section><div class="bar"><h2>Tasks</h2><div class="meter"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div><span class="count">'+done+' / '+total+' done</span></div><div class="status" id="status" aria-live="polite"></div>';
  groups.forEach(function(g){
    var list=by[g], gd=list.filter(function(t){return t.d;}).length;
    h+='<div class="group"><h3><span>'+esc(g)+'</span><span class="count">'+gd+'/'+list.length+'</span></h3>';
    list.forEach(function(t){
      h+='<div class="task'+(t.d?' done':'')+'"><input type="checkbox" id="c-'+t.id+'" data-id="'+t.id+'"'+(t.d?' checked':'')+'><label for="c-'+t.id+'">'+esc(t.t)+'</label><span class="when">'+esc(t.w)+'</span>'+
         '<div class="owner"><span>Owner</span><input type="text" id="o-'+t.id+'" data-id="'+t.id+'" value="'+esc(t.o)+'" placeholder="add a name" aria-label="Owner for: '+esc(t.t)+'"></div></div>';
    });
    h+='</div>';
  });
  h+='</section></div>';
  root.innerHTML=h;
}

function setStatus(m){var s=document.getElementById('status'); if(s) s.textContent=m;}
function find(id){for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i];}

var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var fonts=document.querySelector('link[rel=stylesheet]').getAttribute('href');
  var content='<title>RE Game Night Prep</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="'+fonts+'"><style id="css">'+css+'</style><main id="root"></main><script id="state" type="application/json">'+json+'<\/script><script id="app">'+app+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+content+'</body></html>';
}

function queueSave(){
  clearTimeout(timer);
  if(!artifact){setStatus('Changes show only on this screen. Open the shared page with edit access to save.');return;}
  setStatus('Saving…');
  timer=setTimeout(function(){
    if(saving) return queueSave();
    saving=true;
    artifact.publish(buildDoc()).then(function(){setStatus('Saved');},function(e){
      var c=e&&e.code;
      if(c==='conflict') setStatus('Someone else saved first. The page will reload with their version.');
      else if(c==='not_granted'||c==='not_writer') setStatus('You have view access only, so changes are not saved.');
      else setStatus('Could not save. Try again in a moment.');
    }).then(function(){saving=false;});
  },900);
}

root.addEventListener('change',function(e){
  var el=e.target, t=find(el.getAttribute('data-id')); if(!t) return;
  if(el.type==='checkbox'){ t.d=el.checked; var y=window.scrollY; render(); window.scrollTo(0,y); }
  else { t.o=el.value.slice(0,40); }
  queueSave();
});

render();
if(window.claude&&window.claude.use){ window.claude.use('artifact').then(function(a){artifact=a;}).catch(function(){}); }
})();
</script>

</body></html>
